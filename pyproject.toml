[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "labrat-ai"
version = "0.1.0"
description = "An autonomous agent for controlled machine learning experiments"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "scikit-learn>=1.9,<2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
